[package]
name = "noshell"

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description.workspace = true
readme.workspace = true

[features]
default = []
defmt = ["dep:defmt", "noshell-parser?/defmt"]
events = []
parser = ["dep:noshell-parser"]

[dependencies]
defmt = { workspace = true, optional = true }
futures = { workspace = true }
heapless = { workspace = true }
itertools = { version = "0.14.0", default-features = false }
nom = { workspace = true }
thiserror = { workspace = true }

noshell-macros = { path = "../noshell-macros", version = "0.4.0" }
noshell-parser = { path = "../noshell-parser", version = "0.4.0", optional = true }

noterm = { version = "^0.2.3" }

[dev-dependencies]
insta = "1.46.0"
rstest = "0.26.1"
speculoos = "0.13.0"
tokio = { version = "1.49.0", features = ["full"] }

[[test]]
name = "derived"
path = "tests/derived.rs"
required-features = ["parser"]
